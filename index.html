<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MellFor - Молодой Предприниматель | Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 60px 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideInUp 1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite reverse;
        }

        .card-inner {
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8a2be2 0%, #00ff88 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.5);
            animation: rotate 20s linear infinite;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .name {
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, #8a2be2 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .username {
            font-size: 16px;
            text-align: center;
            color: #00ff88;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .title {
            font-size: 16px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .bio {
            font-size: 13px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(138, 43, 226, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.2);
        }

        .info-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #8a2be2 0%, #00ff88 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(138, 43, 226, 0.5), transparent);
            margin: 30px 0;
        }

        .contact-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            background: rgba(138, 43, 226, 0.1);
            color: #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-btn:hover {
            background: linear-gradient(135deg, #8a2be2 0%, #00ff88 100%);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(138, 43, 226, 0.4);
            border-color: #8a2be2;
        }

        .cta-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #8a2be2 0%, #00ff88 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(138, 43, 226, 0.4);
        }

        .email-btn {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .email-btn:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, 30px);
            }
        }

        .glow {
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
            }
            50% {
                box-shadow: 0 0 40px rgba(138, 43, 226, 0.8);
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 40px 30px;
            }

            .name {
                font-size: 28px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="card">
            <div class="card-inner">
                <div class="avatar">
                    💼
                </div>

                <h1 class="name">MellFor</h1>
                <p class="username">@mellfor</p>
                <p class="title">💎 Молодой Предприниматель</p>
                <p class="bio">Создаю идеи, запускаю проекты<br>Инвестирую в будущее</p>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">📍 Страна</div>
                        <div class="info-value">🇷🇺 Russia</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">🎂 Возраст</div>
                        <div class="info-value">18</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">📱 Имя</div>
                        <div class="info-value">Даня</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">⚡ Статус</div>
                        <div class="info-value">Online</div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="contact-label">🔗 Свяжись со мной</div>
                
                <div class="social-links">
                    <a href="https://t.me/mellfor" class="social-btn" title="Telegram" target="_blank">
                        <i class="fab fa-telegram"></i>
                    </a>
                    <a href="https://instagram.com/mellfor" class="social-btn" title="Instagram" target="_blank">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://twitter.com/mellfor" class="social-btn" title="Twitter/X" target="_blank">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="https://youtube.com/@mellfor" class="social-btn" title="YouTube" target="_blank">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>

                <a href="https://t.me/mellfor" class="cta-btn">
                    <i class="fab fa-telegram"></i> Написать в Telegram
                </a>
                <a href="mailto:mellforus@gmail.com" class="cta-btn email-btn">
                    <i class="fas fa-envelope"></i> mellforus@gmail.com
                </a>

                <center>
                    <span class="badge">✨ Available for Collaboration</span>
                </center>
            </div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0a0a, 1);
        camera.position.z = 5;

        const geometry = new THREE.IcosahedronGeometry(1.5, 4);
        const material = new THREE.MeshPhongMaterial({
            color: 0x8a2be2,
            wireframe: false,
            shininess: 100,
            emissive: 0x8a2be2,
            emissiveIntensity: 0.3
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const light1 = new THREE.PointLight(0x8a2be2, 1, 100);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x00ff88, 0.5, 100);
        light2.position.set(-5, -5, 5);
        scene.add(light2);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        let particles = [];
        for (let i = 0; i < 50; i++) {
            const particleGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const particleMaterial = new THREE.MeshPhongMaterial({
                color: Math.random() > 0.5 ? 0x8a2be2 : 0x00ff88,
                emissive: Math.random() > 0.5 ? 0x8a2be2 : 0x00ff88,
                emissiveIntensity: 0.5
            });
            const particle = new THREE.Mesh(particleGeometry, particleMaterial);
            particle.position.set(
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 20
            );
            particle.velocity = {
                x: (Math.random() - 0.5) * 0.1,
                y: (Math.random() - 0.5) * 0.1,
                z: (Math.random() - 0.5) * 0.1
            };
            scene.add(particle);
            particles.push(particle);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            mesh.rotation.x += 0.003;
            mesh.rotation.y += 0.005;

            particles.forEach(particle => {
                particle.position.x += particle.velocity.x;
                particle.position.y += particle.velocity.y;
                particle.position.z += particle.velocity.z;

                if (Math.abs(particle.position.x) > 10) particle.velocity.x *= -1;
                if (Math.abs(particle.position.y) > 10) particle.velocity.y *= -1;
                if (Math.abs(particle.position.z) > 10) particle.velocity.z *= -1;

                particle.rotation.x += 0.01;
                particle.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
