    <style>
        /* ================== ПЕРЕМЕННЫЕ ================== */
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6f;
            --bg-dark: #0a0e27;
            --bg-darker: #050709;
            --text-light: #e0e0e0;
            --text-muted: #888888;
            --accent-blue: #0088ff;
            --accent-purple: #aa00ff;
            --border-color: rgba(0, 255, 136, 0.1);
        }

        /* ================== RESET ================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 136, 255, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* ================== ПРЕЛОАДЕР ================== */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }

        #preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .preloader-content {
            text-align: center;
        }

        .preloader-logo {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .preloader-progress {
            width: 200px;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .preloader-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent-blue));
            width: 0%;
            border-radius: 2px;
        }

        .preloader-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        .preloader-percent {
            color: var(--primary);
            font-weight: 600;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ================== CANVAS (частицы) ================== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ================== CUSTOM CURSOR ================== */
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            display: none;
        }

        .cursor.active {
            display: block;
        }

        .cursor.hover {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 136, 0.1);
            border-width: 1px;
        }

        /* ================== ТИПОГРАФИЯ ================== */
        h1, h2, h3 {
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 6rem);
        }

        h2 {
            font-size: clamp(1.8rem, 5vw, 3rem);
        }

        /* ================== ОСНОВНЫЕ КОМПОНЕНТЫ ================== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 2rem 0;
            position: relative;
            z-index: 1;
        }

        /* ================== HEADER/NAV ================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 0;
            z-index: 100;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.1em;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.9rem;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: var(--primary);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* ================== HERO SECTION ================== */
        #hero {
            padding-top: 6rem;
            justify-content: flex-start;
        }

        .hero-content {
            animation-name: fadeInUp;
            animation-duration: 1.2s;
            animation-fill-mode: forwards;
            opacity: 0;
        }

        .hero-title {
            line-height: 1;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .hero-title .char {
            display: inline-block;
            opacity: 0;
            animation: charFadeIn 0.6s ease-out forwards;
        }

        @keyframes charFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 500px;
            animation: fadeInUp 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        .hero-cta {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--primary);
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out 0.7s forwards;
            opacity: 0;
            cursor: pointer;
            border: none;
        }

        .hero-cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary-dark);
            transition: left 0.3s;
            z-index: -1;
        }

        .hero-cta:hover::before {
            left: 0;
        }

        .hero-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.2);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================== ABOUT SECTION ================== */
        #about {
            padding: 4rem 0;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-stat {
            margin-bottom: 2rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }

        .stat-label {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        /* ================== PROJECTS SECTION ================== */
        #projects {
            padding: 4rem 0;
        }

        .projects-header {
            margin-bottom: 3rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: rgba(0, 255, 136, 0.03);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 8px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.05), transparent);
            transition: left 0.6s;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-card:hover {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.08);
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 255, 136, 0.15);
        }

        .project-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent-blue));
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .project-name {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ================== CONTACTS SECTION ================== */
        #contacts {
            padding: 4rem 0;
            text-align: center;
        }

        .contacts-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .social-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .social-btn {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: rgba(0, 255, 136, 0.05);
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3
