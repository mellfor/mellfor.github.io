<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danya | NECKMELL Founder - Premium Portfolio</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ============ SCROLL BAR ============ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        /* ============ HERO SECTION ============ */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #0a0a0a 100%);
        }

        #particles-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #canvas-3d {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 40px 20px;
        }

        .hero-title {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 8s ease infinite;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero-subtitle {
            font-size: 24px;
            color: #00ffff;
            margin-bottom: 30px;
            font-weight: 300;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #00ffff;
            margin-left: 4px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .hero-description {
            font-size: 16px;
            color: #b0b0b0;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #00ccff);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: rgba(255, 0, 255, 0.1);
            color: #ff00ff;
            border: 2px solid #ff00ff;
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            transform: translateY(-3px);
        }

        /* ============ NAVBAR ============ */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #b0b0b0;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #00ffff;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
            }
            .nav-links {
                gap: 15px;
                font-size: 14px;
            }
            .hero-title {
                font-size: 42px;
            }
        }

        /* ============ SECTIONS ============ */
        section {
            padding: 100px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 60px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ============ ABOUT SECTION ============ */
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text h3 {
            font-size: 32px;
            color: #00ffff;
            margin-bottom: 20px;
        }

        .about-text p {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .stat-box {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: #00ffff;
        }

        .stat-label {
            font-size: 14px;
            color: #b0b0b0;
            margin-top: 10px;
        }

        .about-image {
            position: relative;
            height: 400px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            overflow: hidden;
        }

        .about-image::before {
            content: '💻';
            font-size: 120px;
        }

        @media (max-width: 768px) {
            .about-container {
                grid-template-columns: 1fr;
            }
            .section-title {
                font-size: 32px;
            }
        }

        /* ============ PROJECTS SECTION ============ */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.05), rgba(255, 0, 255, 0.05));
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2), transparent);
            transition: all 0.3s ease;
            opacity: 0;
        }

        .project-card:hover::before {
            opacity: 1;
            top: 0;
            right: 0;
        }

        .project-card:hover {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(255, 0, 255, 0.15));
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: translateY(-10px);
        }

        .project-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .project-card h3 {
            font-size: 24px;
            color: #00ffff;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }

        .project-card p {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            z-index: 2;
        }

        .project-tag {
            display: inline-block;
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 15px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        /* ============ SKILLS SECTION ============ */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .skill-box {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .skill-box:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .skill-box h4 {
            color: #00ffff;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .skill-box p {
            color: #b0b0b0;
            font-size: 14px;
        }

        /* ============ CONTACTS SECTION ============ */
        .contacts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
